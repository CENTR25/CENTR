<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <!-- Landing at "/" for signed-out visitors. The landing lives in /landing/.
       If Cloudflare already rewrote "/" to it (see _redirects) this never runs.
       Otherwise, at the bare root with no Supabase session, swap the page for
       the landing (URL stays "/"). Signed-in users and every other route boot
       the Flutter app unchanged. document.open() aborts this parser, so the
       Flutter scripts below never load for the landing. -->
  <script>
    (function () {
      try {
        if (location.pathname !== '/') return;
        var signedIn = Object.keys(localStorage).some(function (k) {
          return /sb-.+-auth-token$/.test(k);
        });
        if (signedIn) return;
        var x = new XMLHttpRequest();
        x.open('GET', '/landing/index.html', false);
        x.send();
        if (x.status === 200 && x.responseText.indexOf('PRGS') !== -1) {
          window.__prgsLanding = true;
          document.open();
          document.write(x.responseText);
          document.close();
        }
      } catch (e) { /* fall through to the app */ }
    })();
  </script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PRGS: entrenamiento, rutinas y planes de alimentación para entrenadores y alumnos.">

  <!-- Social share previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PRGS">
  <meta property="og:title" content="PRGS">
  <meta property="og:description" content="Entrenamiento, rutinas y planes de alimentación para entrenadores y alumnos.">
  <meta property="og:url" content="https://prgs.app/">
  <meta property="og:image" content="https://prgs.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PRGS">
  <meta name="twitter:description" content="Entrenamiento, rutinas y planes de alimentación para entrenadores y alumnos.">
  <meta name="twitter:image" content="https://prgs.app/og-image.png">
  <meta name="theme-color" content="#001934">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PRGS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PRGS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Chrome fires beforeinstallprompt before Flutter boots; stash it so the
    // in-app "Agregar a Inicio" pop-up can trigger the native install dialog.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__a2hsDeferred = e;
      window.dispatchEvent(new Event('a2hs-ready'));
    });
  </script>
  <script>
    // iOS swipe-back guard. The initial document history entry has no Flutter
    // serialCount state; when a swipe-back lands on it, the Flutter engine
    // reboots the whole app (visible as the loading screen). Trap that
    // popstate before the engine's listener runs, bounce forward, and surface
    // the gesture to the app as an in-app back intent instead.
    window.addEventListener('popstate', function (e) {
      if (!e.state || e.state.serialCount === undefined) {
        e.stopImmediatePropagation();
        history.forward();
        window.dispatchEvent(new Event('flutter-swipe-back'));
      }
    });
  </script>
  <script>
    // Boot Flutter unless the landing took over this page (see top of <head>).
    if (!window.__prgsLanding) {
      var fb = document.createElement('script');
      fb.src = 'flutter_bootstrap.js';
      fb.async = true;
      document.body.appendChild(fb);
    }
  </script>
</body>
</html>
