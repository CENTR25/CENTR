<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Progress">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Progress</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // iOS swipe-back guard. The initial document history entry has no Flutter
    // serialCount state; when a swipe-back lands on it, the Flutter engine
    // reboots the whole app (visible as the loading screen). Trap that
    // popstate before the engine's listener runs, bounce forward, and surface
    // the gesture to the app as an in-app back intent instead.
    window.addEventListener('popstate', function (e) {
      if (!e.state || e.state.serialCount === undefined) {
        e.stopImmediatePropagation();
        history.forward();
        window.dispatchEvent(new Event('flutter-swipe-back'));
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
